name: Feature request
description: Suggest a focused improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain the workflow problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Relevant platforms
      options:
        - label: Android
        - label: Web
        - label: Windows
        - label: macOS
