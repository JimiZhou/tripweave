name: Bug report
description: Report a reproducible TripWeave problem.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private media, or personal endpoints.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, Web, Windows, macOS]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Describe the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove credentials, file paths, and private media metadata.
