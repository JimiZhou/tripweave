name: Build all clients

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/TripWeave-Android-arm64-v${version}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/TripWeave-Android-armv7-v${version}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/TripWeave-Android-x86_64-v${version}.apk"
          sha256sum dist/* > dist/SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: TripWeave-Android
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web static bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Web
        run: flutter build web --release --base-href /tripweave/
      - name: Verify bundled fallback fonts
        run: |
          test -f build/web/font-fallback/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.58.woff2
          test -f build/web/font-fallback/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.60.woff2
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          mkdir -p dist
          (cd build/web && zip -qr "../../dist/TripWeave-Web-v${version}.zip" .)
          sha256sum dist/* > dist/SHA256SUMS-Web.txt
      - uses: actions/upload-artifact@v7
        with:
          name: TripWeave-Web
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Read version
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $match) { throw "Version not found in pubspec.yaml" }
          "APP_VERSION=$($match.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" "$env:RUNNER_TEMP\ffmpeg"
          $bin = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory -Recurse |
            Where-Object { Test-Path (Join-Path $_.FullName "ffmpeg.exe") } |
            Select-Object -First 1
          if (-not $bin) { throw "FFmpeg binaries were not found" }
          "FFMPEG_BIN=$($bin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build Windows release
        run: flutter build windows --release
      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          Copy-Item "$env:FFMPEG_BIN\ffmpeg.exe" "build\windows\x64\runner\Release\ffmpeg.exe"
          Copy-Item "$env:FFMPEG_BIN\ffprobe.exe" "build\windows\x64\runner\Release\ffprobe.exe"
          & "build\windows\x64\runner\Release\ffmpeg.exe" -hide_banner -encoders 2>&1 | Out-String | Tee-Object -Variable encoders
          foreach ($encoder in @("h264_nvenc", "h264_qsv", "h264_amf")) {
            if ($encoders -notmatch [regex]::Escape($encoder)) { throw "FFmpeg is missing $encoder" }
          }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "installer\tripweave.iss"
      - name: Smoke test installer
        shell: pwsh
        run: |
          $installer = Resolve-Path "dist\TripWeave-Windows-Setup-v$env:APP_VERSION.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "TripWeave-Smoke"
          $result = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer exited with $($result.ExitCode)" }
          foreach ($name in @("tripweave.exe", "ffmpeg.exe", "ffprobe.exe", "LICENSE", "THIRD_PARTY_NOTICES.md")) {
            if (-not (Test-Path (Join-Path $installDir $name))) { throw "Installed application is missing $name" }
          }
          & (Join-Path $installDir "ffprobe.exe") -version
          $uninstaller = Join-Path $installDir "unins000.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
      - name: Checksum
        shell: pwsh
        run: |
          $file = "dist\TripWeave-Windows-Setup-v$env:APP_VERSION.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $file -Leaf)" | Out-File "dist\SHA256SUMS-Windows.txt" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: TripWeave-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact_arch: arm64
            binary_arch: arm64
            label: Apple Silicon
          - runner: macos-15-intel
            artifact_arch: x64
            binary_arch: x86_64
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install packaging dependencies
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg dylibbundler
      - run: flutter pub get
      - name: Build macOS release
        run: flutter build macos --release
      - name: Bundle FFmpeg and package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          artifact_arch="${{ matrix.artifact_arch }}"
          binary_arch="${{ matrix.binary_arch }}"
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Frameworks" dist/staging
          cp "$(command -v ffmpeg)" "$app/Contents/MacOS/ffmpeg"
          cp "$(command -v ffprobe)" "$app/Contents/MacOS/ffprobe"
          dylibbundler -od -b -x "$app/Contents/MacOS/ffmpeg" -d "$app/Contents/Frameworks/" -p @executable_path/../Frameworks/
          dylibbundler -od -b -x "$app/Contents/MacOS/ffprobe" -d "$app/Contents/Frameworks/" -p @executable_path/../Frameworks/
          file "$app/Contents/MacOS/ffmpeg" | grep "$binary_arch"
          file "$app/Contents/MacOS/ffprobe" | grep "$binary_arch"
          "$app/Contents/MacOS/ffmpeg" -hide_banner -encoders 2>&1 | grep h264_videotoolbox
          codesign --force --deep --sign - "$app"
          cp -R "$app" dist/staging/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/staging/
          (cd dist/staging && ditto -c -k --sequesterRsrc . "../TripWeave-macOS-${artifact_arch}-v${version}.zip")
          shasum -a 256 "dist/TripWeave-macOS-${artifact_arch}-v${version}.zip" > "dist/SHA256SUMS-macOS-${artifact_arch}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: TripWeave-macOS-${{ matrix.artifact_arch }}
          path: |
            dist/TripWeave-macOS-*.zip
            dist/SHA256SUMS-macOS-*.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, web, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
